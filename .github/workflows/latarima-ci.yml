
name: La Tarima - CI, SonarQube y OWASP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: la-tarima-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # STAGE 01 - VALIDACION Y COMPILACION
  # ==========================================
  validate:
    name: 01 - Validar y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            la-tarima-back/package-lock.json
            la-tarima-front/package-lock.json

      - name: Instalar dependencias backend
        run: npm ci --prefix la-tarima-back

      - name: Instalar dependencias frontend
        run: npm ci --prefix la-tarima-front

      - name: Comprobar sintaxis backend
        shell: bash
        run: |
          set -euo pipefail
          find la-tarima-back \
            -path '*/node_modules' -prune -o \
            -type f -name '*.js' -print0 \
            | xargs -0 -r -n1 node --check

      # ESLint queda registrado como diagnostico temporal.
      # El build y el Quality Gate siguen siendo obligatorios.
      - name: Ejecutar ESLint frontend
        id: eslint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidencias/eslint
          npm run lint --prefix la-tarima-front \
            2>&1 | tee evidencias/eslint/frontend-eslint.log

      - name: Registrar resultado ESLint
        if: always()
        shell: bash
        env:
          ESLINT_RESULT: ${{ steps.eslint.outcome }}
        run: |
          echo '## Analisis ESLint - La Tarima' >> "$GITHUB_STEP_SUMMARY"
          if [ "$ESLINT_RESULT" = 'failure' ]; then
            echo '::warning::ESLint detecto errores pendientes.'
            echo 'Resultado: ERRORES DETECTADOS (no bloqueante temporalmente)' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$ESLINT_RESULT" = 'success' ]; then
            echo 'Resultado: APROBADO' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Resultado: NO EJECUTADO' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar evidencia ESLint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: la-tarima-eslint-${{ github.run_id }}
          path: evidencias/eslint/
          if-no-files-found: warn
          retention-days: 30

      - name: Compilar frontend React/Vite
        run: npm run build --prefix la-tarima-front

      - name: Auditar dependencias (diagnostico)
        if: always()
        shell: bash
        run: |
          mkdir -p evidencias/npm-audit
          npm audit --prefix la-tarima-back --omit=dev --json \
            > evidencias/npm-audit/backend.json || true
          npm audit --prefix la-tarima-front --omit=dev --json \
            > evidencias/npm-audit/frontend.json || true
          echo '::warning::Revisar vulnerabilidades de dependencias.'
          echo '## Auditoria npm' >> "$GITHUB_STEP_SUMMARY"
          echo 'Revision pendiente: resultados disponibles en artifacts.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar evidencias npm audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: la-tarima-dependencias-${{ github.run_id }}
          path: evidencias/npm-audit/
          if-no-files-found: warn
          retention-days: 30

  # ==========================================
  # STAGE 02A - SONARQUBE UBUNTU LOCAL
  # ==========================================
  sonar:
    name: 02A - SonarQube en Ubuntu local
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: [self-hosted, Linux, X64, latarima-sonar]
    timeout-minutes: 30

    steps:
      - name: Checkout completo para analisis SonarQube
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verificar Docker y SonarQube
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          curl -fsS --max-time 15 \
            http://127.0.0.1:9000/api/system/status
          echo

      - name: Ejecutar SonarScanner y validar Quality Gate
        shell: bash
        env:
          SONAR_HOST_URL: http://127.0.0.1:9000
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Falta SONAR_TOKEN en Repository secrets.'
            exit 1
          fi
          test -f sonar-project.properties
          test -f scripts/ci/sonar-local.sh
          bash scripts/ci/sonar-local.sh

      - name: Publicar evidencias SonarQube
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: la-tarima-sonarqube-${{ github.run_id }}
          path: evidencias/sonarqube/
          if-no-files-found: warn
          retention-days: 30

  # ==========================================
  # STAGE 02B - OWASP ZAP (SIN CAMBIOS)
  # ==========================================
  zap:
    name: 02B - OWASP ZAP en GitHub
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27028:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            la-tarima-back/package-lock.json
            la-tarima-front/package-lock.json

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix la-tarima-back
          npm ci --prefix la-tarima-front

      - name: Verificar script OWASP ZAP
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/ci/zap-baseline.sh

      - name: Levantar entorno temporal y ejecutar ZAP Baseline
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/zap-baseline.sh

      - name: Publicar reporte OWASP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: la-tarima-owasp-zap-${{ github.run_id }}
          path: evidencias/zap/
          if-no-files-found: warn
          retention-days: 30
